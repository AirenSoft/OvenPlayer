name: Publish to npm

# Publishes `ovenplayer` through npm trusted publishing (OIDC), so no
# NPM_TOKEN is stored in this repo. npm identifies the trusted publisher by
# workflow filename, so `publish.yml` has to keep its name to match what is
# configured on npmjs.com.
#
# Runs when a GitHub Release is published, which is the deliberate step that
# releases a version. The release tag is checked against package.json before
# anything is published, so a tag pushed without the version bump fails the
# job instead of publishing the wrong version. npm 10 ships with Node 22 and
# trusted publishing needs 11.5.1 or newer, hence the upgrade step.

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # required for OIDC

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Check the release tag against package.json
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          pkg="$(node -p "require('./package.json').version")"
          if [ "${TAG#v}" != "$pkg" ]; then
            echo "Release tag $TAG does not match package.json version $pkg"
            exit 1
          fi

      - run: npm ci

      - run: npm run build

      - run: npm publish
